<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>ICON • Bar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="main landing" role="main">
      <div class="container">
        <div class="landing__hero">
          <div class="landing__mark" aria-hidden="true">
            <img class="landing__logo" src="./assets/logo.svg" alt="" />
          </div>

          <div class="landing__content">
            <div class="landing__kicker">ICON</div>
            <h1 class="landing__title">Bar &amp; Caffè</h1>
            <p class="landing__lead">Cocktail, caffetteria e aperitivi. Atmosfera calda, servizio semplice.</p>

            <div class="landing__cta">
              <a class="btn btn--primary" href="/menu">Apri il menu</a>
              <a
                class="btn btn--ghost"
                href="https://instagram.com/icon_caffe"
                target="_blank"
                rel="noreferrer"
              >
                Instagram
              </a>
            </div>

            <div class="landing__meta" aria-label="Info">
              <a class="landing__pill" href="/menu">Menu digitale</a>
              <a
                class="landing__pill"
                href="https://instagram.com/icon_caffe"
                target="_blank"
                rel="noreferrer"
              >
                @icon_caffe
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
