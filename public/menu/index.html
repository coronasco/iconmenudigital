<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>ICON • Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="topbar" role="banner">
      <div class="topbar__inner">
        <div class="topbar__row">
          <a class="brandmark" href="/" aria-label="Home">
            <img class="brandmark__logo" src="../assets/logo.svg" alt="" aria-hidden="true" />
          </a>

          <div class="search">
            <label class="search__label" for="q">Cerca</label>
            <input
              id="q"
              class="search__input"
              inputmode="search"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              placeholder="Cerca un prodotto…"
              aria-label="Cerca nel menu"
            />
            <button id="clear" class="search__clear" type="button" aria-label="Cancella ricerca">
              <span aria-hidden="true">×</span>
            </button>
          </div>
        </div>

        <nav class="chips" aria-label="Categorie">
          <button class="chip is-active" data-chip="all" type="button">Tutto</button>
        </nav>
      </div>
    </header>

    <main class="main" role="main">
      <div class="container">
        <div class="meta">
          <div id="count" class="meta__count" aria-live="polite"></div>
          <button id="reset" class="meta__reset" type="button">Azzera</button>
        </div>

        <div id="menu" class="menu" aria-label="Menu"></div>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <div class="footer__note">
          Prezzi in €.
          <span class="muted">Per allergeni e disponibilità, chiedi al personale.</span>
        </div>
      </div>
    </footer>

    <script src="../app.js" defer></script>
  </body>
</html>
